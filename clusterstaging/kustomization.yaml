apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- flux-system
- new.yaml
- deploymentchanges.yaml
- screwedit.yaml
- helm/podinfo

patches:
  - path: deploymentedit.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: myapp
  - path: screwedit.yaml
    target:
      group: ""
      version: v1
      kind: Service
      name: amruth